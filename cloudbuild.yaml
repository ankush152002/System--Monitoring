options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging

steps:
  # Step 1: Authenticate to Docker Hub using substitutions for credentials
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$_DOCKER_PASSWORD" | docker login -u "$_DOCKER_USERNAME" --password-stdin
        docker pull docker.io/ankush152002/system-monitoring-app:10960874397

  # Step 2: Run SonarQube scan
  - name: 'sonarsource/sonar-scanner-cli'
    env:
      - 'SONAR_TOKEN=${_SONAR_TOKEN}'  # Pass SonarQube token as environment variable
    args:
      - 'sonar-scanner'
      - '-Dsonar.projectKey=cloudbuild123'
      - '-Dsonar.sources=.'
      - '-Dsonar.host.url=http://34.42.227.155:9000'
      - '-Dsonar.login=${_SONAR_TOKEN}'



# Substitutions (for Docker and SonarQube credentials)
substitutions:
  _DOCKER_USERNAME: 'ankush152002'
  _DOCKER_PASSWORD: 'dckr_pat_e3_gG4EVM4aFmkKkeAXj14if9Dk'
  _SONAR_TOKEN: 'sqa_0b47cdd93521d0a8572ac7fa028793448dac9b57'

options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging
