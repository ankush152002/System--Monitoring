options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging

steps:
  # Step 1: Authenticate to Docker Hub using substitutions for credentials
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$_DOCKER_PASSWORD" | docker login -u "$_DOCKER_USERNAME" --password-stdin
        docker pull docker.io/ankush152002/system-monitoring-app@sha256:5648ce068d3245aaae9d2fcece69805c0abdd9b203e896d59e8e5b83060bab10

  # Step 3: Sign the image with Binary Authorization (Optional, if required)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'beta'
      - 'container'
      - 'binauthz'
      - 'attestations'
      - 'sign-and-create'
      - '--artifact-url=docker.io/ankush152002/system-monitoring-app@sha256:5648ce068d3245aaae9d2fcece69805c0abdd9b203e896d59e8e5b83060bab10'
      - '--attestor=anilk'  # Replace with your attestor name
      - '--attestor-project=cloudbuild-450108'  # Replace with your project ID
      - '--keyversion=projects/cloudbuild-450108/locations/global/keyRings/binaryauthorization-keys/cryptoKeys/demo-key/cryptoKeyVersions/1'

  # Step 4: Verify image with Binary Authorization before deployment
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'beta'
      - 'container'
      - 'binauthz'
      - 'attestations'
      - 'list'
      - '--artifact-url=docker.io/ankush152002/system-monitoring-app@sha256:5648ce068d3245aaae9d2fcece69805c0abdd9b203e896d59e8e5b83060bab10'

  # Step 5: Deploy to GKE (if verification is successful)
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=deployment.yaml'
      - '--image=docker.io/ankush152002/system-monitoring-app@sha256:5648ce068d3245aaae9d2fcece69805c0abdd9b203e896d59e8e5b83060bab10'
      - '--cluster=sonar-cluster'
      - '--location=us-central1-a'

options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging
