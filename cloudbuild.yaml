options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging

steps:
  # Step 1: Authenticate to Docker Hub using Secret Manager
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        docker pull docker.io/ankush152002/system-monitoring-app:13178729011

  # Step 2: Run SonarQube scan
  - name: 'sonarsource/sonar-scanner-cli'
    env:
      - 'SONAR_TOKEN=${_SONAR_TOKEN}'  # Pass SonarQube token as environment variable
    args:
      - 'sonar-scanner'
      - '-Dsonar.projectKey=cloudbuild123'
      - '-Dsonar.sources=src'
      - '-Dsonar.host.url=http://34.42.227.155:9000'
      - '-Dsonar.login=${_SONAR_TOKEN}'

  # Step 3: Push the Docker image back to Docker Hub (if scans pass)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'docker.io/ankush152002/system-monitoring-app:latest'

# Substitutions (for the SonarQube token)
substitutions:
  _SONAR_TOKEN: 'sqp_a2de61de7b7df8d04775a320c152068e73a4c05c'

# Use Secret Manager to provide sensitive values
availableSecrets:
  secretManager:
    - versionName: projects/906367866358/secrets/DOCKER_USERNAME/versions/latest
      env: 'DOCKER_USERNAME'
    - versionName: projects/906367866358/secrets/DOCKER_PASSWORD/versions/latest
      env: 'DOCKER_PASSWORD'
