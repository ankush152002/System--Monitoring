options:
  logging: CLOUD_LOGGING_ONLY  # Enable Cloud Logging for debugging

steps:
  # Step 1: Authenticate to Docker Hub using substitutions for credentials
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$_DOCKER_PASSWORD" | docker login -u "$_DOCKER_USERNAME" --password-stdin
        docker pull docker.io/ankush152002/system-monitoring-app:10960874397

  





